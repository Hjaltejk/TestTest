<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
  <title>Tilbudskøkkenet</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315803d'/%3E%3Cpath d='M9 17.5l4.5 4.5L23 11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Spring til indhold</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Tilbudskøkkenet – forside">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8"/><path d="M9 17.5l4.5 4.5L23 11"/></svg>
        </span>
        <span class="brand-name">Tilbudskøkkenet</span>
      </a>
      <nav class="nav" aria-label="Hovedmenu">
        <a href="#/" data-route="ranking">
          <svg class="i" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 21l1.6-7L2 9.2l7.1-.6z"/></svg>
          <span>I dag</span>
        </a>
        <a href="#/opskrifter" data-route="recipes">
          <svg class="i" viewBox="0 0 24 24"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v16H6.5A2.5 2.5 0 0 0 4 21.5 2.5 2.5 0 0 0 6.5 24H19"/><path d="M9 7h6"/></svg>
          <span>Opskrifter</span>
        </a>
        <a href="#/tilbud" data-route="offers">
          <svg class="i" viewBox="0 0 24 24"><path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><circle cx="7" cy="7" r="1.5"/></svg>
          <span>Tilbud</span>
        </a>
      </nav>
    </div>
  </header>

  <main id="main" class="main" tabindex="-1">
    <section id="view-ranking" class="view" aria-labelledby="ranking-title"></section>
    <section id="view-recipes" class="view" aria-labelledby="recipes-title" hidden></section>
    <section id="view-offers" class="view" aria-labelledby="offers-title" hidden></section>
  </main>

  <!-- Detaljepanel for en opskrift -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <!-- Avisudklip -->
  <dialog id="clip" class="modal modal-sm" aria-labelledby="clip-title">
    <div id="clip-body"></div>
  </dialog>

  <!-- Opret/redigér opskrift -->
  <dialog id="editor" class="modal modal-lg" aria-labelledby="editor-title">
    <form id="editor-form" novalidate></form>
  </dialog>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
